<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rasca para descubrir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@900&family=Playfair+Display:wght@500;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset estricto a pantalla completa sin márgenes, scroll ni desbordamientos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            /* Fondo cálido perla con ligero contraste para que brillen tanto los tonos claros como los destellos */
            background: radial-gradient(circle at center, #f4eee8 0%, #e9e0d6 100%);
            color: #262220;
            font-family: 'Inter', sans-serif;
        }

        /* Capa inferior con la frase oculta centrada en toda la pantalla */
        .hidden-message-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.25rem;
            text-align: center;
            z-index: 1;
        }

        .hidden-message-text {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.55rem, 6.2vw, 2.5rem);
            font-weight: 600;
            line-height: 1.55;
            max-width: 34rem;
            color: #292421;
            letter-spacing: -0.01em;
        }

        /* Contenedores SVG inline para palabras con bandera real en su interior */
        .flag-word-svg {
            display: inline-block;
            vertical-align: -0.22em;
            height: 1.24em;
            width: auto;
            overflow: visible;
            margin: 0 0.03em;
        }

        .flag-word-uruguay {
            filter: drop-shadow(0 2px 4px rgba(0, 40, 120, 0.25));
        }

        .flag-word-colombia {
            filter: drop-shadow(0 2px 4px rgba(180, 20, 40, 0.22));
        }

        .flag-svg-text {
            font-family: 'Montserrat', 'Arial Black', Impact, sans-serif;
            font-weight: 900;
            font-size: 56px;
            letter-spacing: -0.5px;
        }

        /* 3. Palabra "ama": color rojo intenso con animación pulsante de latido */
        .word-ama {
            display: inline-block;
            font-weight: 800;
            color: #DC2626;
            padding: 0 0.12em;
            transform-origin: center center;
            animation: heartbeat 1.35s ease-in-out infinite;
            text-shadow: 0 2px 10px rgba(220, 38, 38, 0.25);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.22);
            }
            30% {
                transform: scale(1.04);
            }
            45% {
                transform: scale(1.16);
            }
            65% {
                transform: scale(1);
            }
        }

        /* 4. Palabra "hermosa": tono cálido dorado-rosado con brillitos saliendo alrededor */
        .word-hermosa {
            position: relative;
            display: inline-block;
            font-weight: 800;
            background: linear-gradient(135deg, #b86b35 0%, #d97706 45%, #be185d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 6px rgba(217, 119, 6, 0.22));
        }

        /* Partícula de destello / brillito animado */
        .sparkle-particle {
            position: absolute;
            pointer-events: none;
            width: var(--size, 12px);
            height: var(--size, 12px);
            left: var(--x, 50%);
            top: var(--y, 50%);
            transform: translate(-50%, -50%) scale(0);
            animation: sparkleFloat var(--duration, 1.6s) ease-out forwards;
            z-index: 2;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
            }
            35% {
                opacity: 1;
                transform: translate(calc(-50% + var(--tx, 0px) * 0.4), calc(-50% + var(--ty, -12px) * 0.4)) scale(1.15) rotate(45deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, -24px))) scale(0.2) rotate(90deg);
            }
        }

        /* Canvas metálico que cubre el 100% de la pantalla */
        #scratchCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: block;
            z-index: 10;
            touch-action: none;
            cursor: crosshair;
            transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Instrucción superior limpia y legible sobre la capa */
        .top-instruction {
            position: fixed;
            top: max(1.75rem, env(safe-area-inset-top, 1.75rem));
            left: 0;
            right: 0;
            z-index: 20;
            text-align: center;
            pointer-events: none;
            padding: 0 1rem;
            transition: opacity 0.5s ease;
        }

        .top-instruction span {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: #3f3832;
            background-color: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body>

    <!-- Frase oculta debajo de la capa raspable -->
    <main class="hidden-message-layer">
        <p class="hidden-message-text">
            Este 
            <svg class="flag-word-svg flag-word-uruguay" viewBox="0 0 322 68" aria-label="uruguayo" role="img">
                <defs>
                    <clipPath id="clip-uruguayo">
                        <text x="161" y="51" text-anchor="middle" class="flag-svg-text">uruguayo</text>
                    </clipPath>
                </defs>
                <!-- Bandera real de Uruguay recortada dentro de las letras -->
                <g clip-path="url(#clip-uruguayo)">
                    <!-- Base blanca (cubriendo las 5 franjas blancas) -->
                    <rect x="0" y="6" width="322" height="54" fill="#FFFFFF" />
                    <!-- 4 franjas azul celeste oficial (#0038A8) sobre 9 divisiones verticales -->
                    <rect x="0" y="12" width="322" height="6" fill="#0038A8" />
                    <rect x="0" y="24" width="322" height="6" fill="#0038A8" />
                    <rect x="0" y="36" width="322" height="6" fill="#0038A8" />
                    <rect x="0" y="48" width="322" height="6" fill="#0038A8" />
                    <!-- Cantón superior izquierdo blanco (primeras 5 franjas de altura) -->
                    <rect x="0" y="6" width="76" height="30" fill="#FFFFFF" />
                    <!-- Sol de Mayo dorado (#FCD116) visible dentro de las primeras letras ('ur') -->
                    <g transform="translate(36, 21)">
                        <!-- Rayos del Sol de Mayo -->
                        <g fill="#FCD116" stroke="#B45309" stroke-width="0.5">
                            <polygon points="0,-13 1.8,-5 -1.8,-5" />
                            <polygon points="0,13 1.8,5 -1.8,5" />
                            <polygon points="-13,0 -5,1.8 -5,-1.8" />
                            <polygon points="13,0 5,1.8 5,-1.8" />
                            <polygon points="-9.2,-9.2 -2.6,-4.4 -4.4,-2.6" />
                            <polygon points="9.2,9.2 2.6,4.4 4.4,2.6" />
                            <polygon points="9.2,-9.2 4.4,-2.6 2.6,-4.4" />
                            <polygon points="-9.2,9.2 -4.4,2.6 -2.6,4.4" />
                        </g>
                        <!-- Disco solar central -->
                        <circle cx="0" cy="0" r="5.5" fill="#FCD116" stroke="#B45309" stroke-width="0.7" />
                    </g>
                </g>
                <!-- Contorno negro exterior más fuerte para que cada letra resalte nítidamente -->
                <text x="161" y="51" text-anchor="middle" class="flag-svg-text" fill="none" stroke="#111111" stroke-width="3.2" stroke-linejoin="round" style="paint-order: stroke fill;">uruguayo</text>
            </svg>
            te <span class="word-ama">ama</span> con todo su corazon y hará todo para hacer feliz a su 
            <svg class="flag-word-svg flag-word-colombia" viewBox="0 0 374 68" aria-label="colombiana" role="img">
                <defs>
                    <clipPath id="clip-colombiana">
                        <text x="187" y="51" text-anchor="middle" class="flag-svg-text">colombiana</text>
                    </clipPath>
                </defs>
                <!-- Bandera real de Colombia con proporciones oficiales (50% amarillo, 25% azul, 25% rojo) -->
                <g clip-path="url(#clip-colombiana)">
                    <!-- Franja superior amarilla (50% de la altura útil de la letra) -->
                    <rect x="0" y="6" width="374" height="27" fill="#FCD116" />
                    <!-- Franja central azul (25% de la altura útil) -->
                    <rect x="0" y="33" width="374" height="13.5" fill="#003893" />
                    <!-- Franja inferior roja (25% de la altura útil) -->
                    <rect x="0" y="46.5" width="374" height="13.5" fill="#CE1126" />
                </g>
                <!-- Contorno negro exterior más fuerte para máxima definición tipográfica -->
                <text x="187" y="51" text-anchor="middle" class="flag-svg-text" fill="none" stroke="#111111" stroke-width="3.2" stroke-linejoin="round" style="paint-order: stroke fill;">colombiana</text>
            </svg>
            <span id="wordHermosa" class="word-hermosa">hermosa</span>.
        </p>
    </main>

    <!-- Capa superior metálica 100% pantalla completa -->
    <canvas id="scratchCanvas"></canvas>

    <!-- Única instrucción superior -->
    <div id="topInstruction" class="top-instruction">
        <span>Rasca para descubrir</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const topInstruction = document.getElementById('topInstruction');
            const wordHermosa = document.getElementById('wordHermosa');

            let isDrawing = false;
            let lastPoint = null;
            let isRevealed = false;
            let hasStarted = false;
            let strokeCounter = 0;

            /**
             * Genera brillitos SVG dorados y rosados que emergen alrededor de la palabra "hermosa"
             */
            function spawnSparkle() {
                if (!wordHermosa) return;

                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle-particle';

                // Posición inicial alrededor del contorno de la palabra
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;

                // Desplazamiento hacia afuera desde el centro
                const angle = Math.atan2(startY - 50, startX - 50) + (Math.random() - 0.5) * 0.7;
                const distance = 16 + Math.random() * 22;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 6;

                const size = 9 + Math.random() * 9;
                const duration = 1.2 + Math.random() * 0.8;
                const colors = ['#F59E0B', '#FBBF24', '#F43F5E', '#FFFFFF', '#FDE68A'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                sparkle.style.setProperty('--x', `${startX}%`);
                sparkle.style.setProperty('--y', `${startY}%`);
                sparkle.style.setProperty('--tx', `${tx}px`);
                sparkle.style.setProperty('--ty', `${ty}px`);
                sparkle.style.setProperty('--size', `${size}px`);
                sparkle.style.setProperty('--duration', `${duration}s`);

                sparkle.innerHTML = `
                    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="${color}">
                        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                    </svg>
                `;

                wordHermosa.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, duration * 1000);
            }

            // Emitir destellos continuamente alrededor de "hermosa"
            setInterval(spawnSparkle, 280);

            // Umbral del 50% para desvanecer suavemente el resto de la capa
            const REVEAL_THRESHOLD = 50;

            /**
             * Configura el lienzo al 100% del viewport con densidad de píxeles nativa
             */
            function setupCanvas() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;

                canvas.width = width * dpr;
                canvas.height = height * dpr;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);

                // Pintar capa base metálica
                ctx.globalCompositeOperation = 'source-over';
                const gradient = ctx.createLinearGradient(0, 0, width, height);
                gradient.addColorStop(0, '#d8d2ca');
                gradient.addColorStop(0.3, '#e4d6be');
                gradient.addColorStop(0.65, '#c9bda9');
                gradient.addColorStop(1, '#dfd6c7');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // Textura metálica satinada sutil
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
                const particleCount = Math.floor((width * height) / 900);
                for (let i = 0; i < particleCount; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        Math.random() * width,
                        Math.random() * height,
                        Math.random() * 1.4,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
                ctx.lineWidth = 1;
                for (let i = -height; i < width; i += 16) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + height, height);
                    ctx.stroke();
                }
                ctx.restore();

                // Configurar modo de borrado táctil suave
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = Math.max(44, Math.min(width, height) * 0.13);
            }

            /**
             * Obtiene coordenadas relativas al viewport para touch o mouse
             */
            function getCoordinates(e) {
                if (e.touches && e.touches.length > 0) {
                    return {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                }
                return {
                    x: e.clientX,
                    y: e.clientY
                };
            }

            /**
             * Dibuja un trazo continuo de borrado
             */
            function scratch(pos) {
                if (isRevealed) return;

                if (!hasStarted) {
                    hasStarted = true;
                    // Atenuar discretamente la instrucción superior al empezar a raspar
                    topInstruction.style.opacity = '0.35';
                }

                ctx.beginPath();
                if (lastPoint) {
                    ctx.moveTo(lastPoint.x, lastPoint.y);
                    ctx.lineTo(pos.x, pos.y);
                } else {
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
                }
                ctx.stroke();
                lastPoint = pos;

                strokeCounter++;
                if (strokeCounter % 8 === 0) {
                    checkScratchedProgress();
                }
            }

            /**
             * Evalúa si se alcanzó ~50% de área raspada para desvanecer el resto
             */
            function checkScratchedProgress() {
                if (isRevealed) return;

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let transparentPixels = 0;
                let totalSampled = 0;

                // Muestreo rápido cada 32 píxeles (128 bytes RGBA) para 60fps constantes
                const step = 128;
                for (let i = 3; i < data.length; i += step) {
                    totalSampled++;
                    if (data[i] < 128) {
                        transparentPixels++;
                    }
                }

                const percentage = (transparentPixels / totalSampled) * 100;
                if (percentage >= REVEAL_THRESHOLD) {
                    revealComplete();
                }
            }

            /**
             * Desvanece suavemente la capa restante y oculta la instrucción superior
             */
            function revealComplete() {
                if (isRevealed) return;
                isRevealed = true;
                isDrawing = false;

                canvas.style.opacity = '0';
                canvas.style.pointerEvents = 'none';
                topInstruction.style.opacity = '0';
            }

            // Eventos táctiles (móvil)
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDrawing = true;
                lastPoint = getCoordinates(e);
                scratch(lastPoint);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                scratch(getCoordinates(e));
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                isDrawing = false;
                lastPoint = null;
                checkScratchedProgress();
            });

            // Eventos de ratón (desktop)
            canvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                lastPoint = getCoordinates(e);
                scratch(lastPoint);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                scratch(getCoordinates(e));
            });

            window.addEventListener('mouseup', () => {
                if (isDrawing) {
                    isDrawing = false;
                    lastPoint = null;
                    checkScratchedProgress();
                }
            });

            // Reajustar si cambia la orientación antes de revelar
            window.addEventListener('resize', () => {
                if (!isRevealed && !hasStarted) {
                    setupCanvas();
                }
            });

            setupCanvas();
        });
    </script>
</body>
</html>
